[platform]
name = "armv7m-unknown-none"
schema = 2
family = "lm3s6965evb"
compiler-interface = 1
description = "ARMv7-M bare-metal runtime"

[[platform.isa]]
triple = "armv7m-unknown-none"
arch = "arm"
default = true
expected_abi_hash = "0x4e2b602bb1069843"

[metal]
path = "metal"
startup = "runtime.asm"
linker = "link.ld"

[memory]
flash = { name = "FLASH", origin = 0x00000000, length = 0x00040000, exec = "xip" }
sram = { name = "SRAM", origin = 0x20000000, length = 0x00010000 }
ds_region = "SRAM"
ds_size = 0x4000

[features.concurrency]
unit = "concurrency.asm"

[features.module-loading]
unit = "modload.asm"

[capabilities.gpio]
glue = "glue/gpio"

[capabilities.uart]
glue = "glue/uart"

[capabilities.time]
glue = "glue/time"

[deploy]
method = "openocd"
boot = "raw_vectors"

[[deploy.step]]
run = "openocd"
args = ["-f", "{probe_config}", "-c", "program {elf} reset exit"]

[debug]
diag_transport = "semihosting"
rsp = "probe"
probe = "openocd"
probe_config = "armv7m.cfg"

[test]
rung = "untested"

[test.debug_agent]
supported = true
target = "crates/tyu/tests/escalate.rs"
evidence = "evidence/debug_escalate.md"

# ---- descriptor v2 ---------------------------------------------------------

[[platform.apertures]]
id = 0
name = "scratch"               # lm3s6965evb SRAM; QEMU MMIO scratch (D-14)
kind = "bus"
scratch = true                 # deliberately aliases SRAM (test fiction)
bind = "arm-thumb-ldr-literal"
base = 0x20000000
size = 0x10000

[[platform.apertures]]
id = 1
name = "systick"               # Cortex-M SysTick SCS region (isr fixtures)
kind = "bus"
bind = "arm-thumb-ldr-literal"
base = 0xE000E010
size = 0x1000

# Devices for the execution-test fixtures (P4 migration, D-14).
[[platform.devices]]
map = "Scratch"
instance = "scratch"
aperture = 0
base_offset = 0x0
registers = [
  { offset = 0x00, name = "A", width = 32, access = "rw" },
  { offset = 0x04, name = "B", width = 32, access = "rw" },
]

[[platform.devices]]
map = "Scratch"
instance = "ptrscratch"
aperture = 0
base_offset = 0x7100
registers = [
  { offset = 0x00, name = "FIRST", width = 64, access = "rw" },
  { offset = 0x08, name = "SECOND", width = 64, access = "rw" },
]

[[platform.devices]]
map = "Scratch"
instance = "widthscratch"
aperture = 0
base_offset = 0x7000
registers = [
  { offset = 0x00, name = "B", width = 8, access = "rw" },
  { offset = 0x02, name = "H", width = 16, access = "rw" },
  { offset = 0x04, name = "W", width = 32, access = "rw" },
  { offset = 0x08, name = "D", width = 64, access = "rw" },
]

[[platform.devices]]
map = "SysTick"
instance = "systick"
aperture = 1
base_offset = 0x0
registers = [
  { offset = 0x00, name = "CTRL", width = 32, access = "rw" },
  { offset = 0x04, name = "LOAD", width = 32, access = "rw" },
  { offset = 0x08, name = "VAL", width = 32, access = "rw" },
]

[[platform.devices]]
map = "Scratch"
instance = "datascratch"
aperture = 0
base_offset = 0x7000
registers = [
  { offset = 0x00, name = "DATA", width = 64, access = "rw" },
]

[[platform.devices]]
map = "GPIO"
instance = "gpio"
aperture = 0
base_offset = 0x0
registers = [
  { offset = 0x00, name = "DATA", width = 32, access = "rw" },
]

[[platform.devices]]
map = "Strategy"
instance = "strategy"
aperture = 0
base_offset = 0x6000
registers = [
  { offset = 0x00, name = "CTRL", width = 32, access = "rw", write_kind = "plain", read_kind = "plain", atomic_max = 32 },
  { offset = 0x04, name = "STATUS", width = 32, access = "rw", write_kind = "w1c", read_kind = "plain", atomic_max = 32 },
  { offset = 0x08, name = "SETBITS", width = 32, access = "rw", write_kind = "w1s", read_kind = "plain", atomic_max = 32 },
  { offset = 0x10, name = "FIFO", width = 8, access = "rw", write_kind = "plain", read_kind = "effectful", atomic_max = 8 },
  { offset = 0x14, name = "FIFO32", width = 32, access = "rw", write_kind = "plain", read_kind = "effectful", atomic_max = 32 },
  { offset = 0x18, name = "SETEFF", width = 32, access = "rw", write_kind = "w1s", read_kind = "effectful", atomic_max = 32 },
  { offset = 0x20, name = "WIDEW", width = 64, access = "rw", write_kind = "plain", read_kind = "plain", atomic_max = 32 },
  { offset = 0x28, name = "SETXOR", width = 32, access = "rw", write_kind = "xor", read_kind = "plain", atomic_max = 32 },
]

[[platform.devices]]
map = "StrategySeed"
instance = "strategy_seed"
aperture = 0
base_offset = 0x6000
registers = [
  { offset = 0x04, name = "STATUS", width = 32, access = "rw" },
]

[platform.metal.trust]
words = ["platform.mem.region-create", "platform.mem.region-alloc", "platform.mem.region-reset", "platform.mem.region-destroy"]
