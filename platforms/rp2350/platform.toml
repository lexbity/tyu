# RP2350 board pack - descriptor v2 (P8).
#
# Every offset, name and IRQ number below is transcribed from RP-008373-DS-2
# (devdocs/HW-datasheets/RP-008373-DS-2-rp2350-datasheet.pdf): address map
# Tables 13/14, system IRQs Table 95, per-peripheral "List of registers".
# Access semantics follow the datasheet Type column per register field table:
#   WC -> access="rw" write_kind="w1c"     WF -> access="wo"
#   RO -> access="ro"                      RW -> access="rw"
# plus read_kind="effectful" on FIFO/data-pop and spinlock-acquire reads.
# Rows deliberately excluded are listed with their rationale in
# platforms/rp2350/docs/descriptor-notes.md.

[platform]
name = "rp2350"
schema = 2
family = "rp2350"
compiler-interface = 1
description = "Raspberry Pi Pico 2 / RP2350 custom platform"

[[platform.isa]]
triple = "armv7m-unknown-none"
arch = "arm"
default = true
expected_abi_hash = "0x4e2b602bb1069843"
metal = { path = "metal/armv7m", startup = "runtime.asm", linker = "link.ld" }

[[platform.isa]]
triple = "riscv32-unknown-none"
arch = "riscv"
expected_abi_hash = "0x49d5b84f8a5a3c42"
metal = { path = "metal/riscv32", startup = "runtime.asm", linker = "link.ld" }

[metal]
path = "metal/armv7m"
startup = "runtime.asm"
linker = "link.ld"

[memory]
flash = { name = "FLASH", origin = 0x10000000, length = 0x00400000, exec = "xip" }
sram  = { name = "SRAM",  origin = 0x20000000, length = 0x00082000 }   # 520 KiB: banks 0-7 striped + banks 8-9 (DS2 Tables 11-12)
ds_region = "SRAM"
ds_size = 0x4000

# Concurrency (tasks) is supported; module loading is deliberately not
# declared: the on-device dynamic loader (loader-core staticlib plus its
# load arena) does not fit in 520 kB of SRAM, so this pack builds static
# images only. `tyu build --mode=dynamic` fails fast on the missing entry
# unit instead of linking an image that cannot fit.
[features.concurrency]
unit = "concurrency.asm"

[capabilities.gpio]
glue = "glue/gpio"

[capabilities.uart]
glue = "glue/uart"

[capabilities.time]
glue = "glue/time"

[deploy]
method = "uf2"
boot = "image_def"   # emitted by `tyu build` as a PICOBIN block (DS2 5.9.5)

[[deploy.step]]
run = "picotool"
args = ["load", "{elf}", "-f", "-x"]

[debug]
diag_transport = "uart0"
rsp = "probe"
probe = "openocd"
probe_config = "rp2350.cfg"

[test]
rung = "hardware"
target = "crates/tyu/tests/platform_hil.rs"
evidence = "docs/hil/rp2350.md"

[secure_boot]
supported = false
encryption_implies_secure_boot = true

# ---- descriptor v2 ---------------------------------------------------------

[platform.scoped]
metadata_slots_max = 64

# Apertures (DS2 Tables 13/14). The APB segment covers every APB peripheral
# through TBMAN (0x40160000); PIO0/PIO1 live in the AHB segment; SIO is the
# core-local bank. There is deliberately no scratch aperture aliasing SRAM on
# the real board: QEMU-model fixtures use the runtime descriptors (D-14).
[[platform.apertures]]
id = 0
name = "apb"
kind = "bus"
bind = "arm-thumb-ldr-literal"
base = 0x40000000
size = 0x01000000

[[platform.apertures]]
id = 1
name = "pio"                    # PIO0 + PIO1 (0x50200000/0x50300000)
kind = "bus"
bind = "arm-thumb-ldr-literal"
base = 0x50200000
size = 0x00200000

[[platform.apertures]]
id = 2
name = "sio"                    # core-local SIO (0xd0000000)
kind = "bus"
bind = "arm-thumb-ldr-literal"
base = 0xd0000000
size = 0x1000

# IO_BANK0 (DS2 3.19 / section 9.11), base 0x40028000, IO_IRQ_BANK0 = 21.
# STATUS reads the pad (RO); CTRL selects function/overrides (RW).
# INTR0-5 are write-1-to-clear raw status (Type WC), 8 pins per register.
[[platform.devices]]
map = "GPIO"
instance = "gpio0"
aperture = 0
