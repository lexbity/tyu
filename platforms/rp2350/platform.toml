[platform]
name = "rp2350"
schema = 2
family = "rp2350"
compiler-interface = 1
description = "Raspberry Pi Pico 2 / RP2350 custom platform"

[[platform.isa]]
triple = "armv7m-unknown-none"
arch = "arm"
default = true
expected_abi_hash = "0x4e2b602bb1069843"
metal = { path = "metal/armv7m", startup = "runtime.asm", linker = "link.ld" }

[[platform.isa]]
triple = "riscv32-unknown-none"
arch = "riscv"
expected_abi_hash = "0x49d5b84f8a5a3c42"
metal = { path = "metal/riscv32", startup = "runtime.asm", linker = "link.ld" }

[metal]
path = "metal/armv7m"
startup = "runtime.asm"
linker = "link.ld"

[memory]
flash = { name = "FLASH", origin = 0x10000000, length = 0x00400000, exec = "xip" }
sram = { name = "SRAM", origin = 0x20000000, length = 0x00084000 }
ds_region = "SRAM"
ds_size = 0x4000

[capabilities.gpio]
glue = "glue/gpio"

[capabilities.uart]
glue = "glue/uart"

[capabilities.time]
glue = "glue/time"

[deploy]
method = "uf2"
boot = "image_def"

[[deploy.step]]
run = "picotool"
args = ["load", "{elf}", "-f", "-x"]

[debug]
diag_transport = "uart0"
rsp = "probe"
probe = "openocd"
probe_config = "rp2350.cfg"

[test]
rung = "hardware"
target = "crates/tyu/tests/platform_hil.rs"
evidence = "docs/hil/rp2350.md"

[secure_boot]
supported = false
encryption_implies_secure_boot = true

# ---- descriptor v2 ---------------------------------------------------------

[platform.allocator]
region = "SRAM"                # memory region allocatable payloads live in
offset = 0x8400                # byte offset into region (carve-out below DS/RS)
length = 0x77000               # allocatable span
impl = "glue/region"           # module dir providing platform.region.* words
policy = "pool-firstfit"       # documentation for reviewers; opaque to toolchain

[platform.scoped]
metadata_slots_max = 64        # diagnostic bound; per-word body count must be <=

# Datasheet-verified apertures (P8, RP2350 §2.3). The APB aperture covers the
# 0x40000000-0x41000000 peripheral block; PIO at 0x50200000 and SIO at
# 0xD0000000 are separate regions; `mmio` is the QEMU/HIL scratch.
[[platform.apertures]]
id = 0
name = "apb"
kind = "bus"
bind = "arm-thumb-ldr-literal"
base = 0x40000000
size = 0x01000000

[[platform.apertures]]
id = 1
name = "mmio"                  # QEMU/HIL scratch
kind = "bus"
bind = "arm-thumb-ldr-literal"
base = 0x20000000
size = 0x1000

[[platform.apertures]]
id = 2
name = "pio"                   # PIO0/PIO1 (0x50200000/0x50300000)
kind = "bus"
bind = "arm-thumb-ldr-literal"
base = 0x50200000
size = 0x00200000

[[platform.apertures]]
id = 3
name = "sio"                   # SIO (0xD0000000)
kind = "bus"
bind = "arm-thumb-ldr-literal"
base = 0xD0000000
size = 0x1000

# ---- Datasheet-derived device tables (P8) ----------------------------------

# GPIO bank0 ctrl/status block (RP2350 §2.19.3), base 0x40014000.
[[platform.devices]]
map = "GPIO"
instance = "gpio0"
aperture = 0
base_offset = 0x14000
registers = [
  { offset = 0x000, name = "GPIO0_CTRL", width = 32, access = "rw", write_kind = "plain", read_kind = "plain", atomic_max = 32 },
  { offset = 0x004, name = "GPIO0_STATUS", width = 32, access = "ro", read_kind = "plain", atomic_max = 32 },
  { offset = 0x008, name = "GPIO1_CTRL", width = 32, access = "rw", write_kind = "plain", read_kind = "plain", atomic_max = 32 },
  { offset = 0x00C, name = "GPIO1_STATUS", width = 32, access = "ro", read_kind = "plain", atomic_max = 32 },
  { offset = 0x078, name = "GPIO15_CTRL", width = 32, access = "rw", write_kind = "plain", read_kind = "plain", atomic_max = 32 },
  { offset = 0x07C, name = "GPIO15_STATUS", width = 32, access = "ro", read_kind = "plain", atomic_max = 32 },
  { offset = 0x0CC, name = "INTR0", width = 32, access = "ro", read_kind = "plain", atomic_max = 32, irq = 13 },
  { offset = 0x0D0, name = "INTR1", width = 32, access = "ro", read_kind = "plain", atomic_max = 32, irq = 13 },
  { offset = 0x0D4, name = "INTR2", width = 32, access = "ro", read_kind = "plain", atomic_max = 32, irq = 13 },
  { offset = 0x0D8, name = "INTR3", width = 32, access = "ro", read_kind = "plain", atomic_max = 32, irq = 13 },
]

