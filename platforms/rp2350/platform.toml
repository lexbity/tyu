[platform]
name = "rp2350"
schema = 2
family = "rp2350"
compiler-interface = 1
description = "Raspberry Pi Pico 2 / RP2350 custom platform"

[[platform.isa]]
triple = "armv7m-unknown-none"
arch = "arm"
default = true
expected_abi_hash = "0x5d36b0efe4b2e904"
metal = { path = "metal/armv7m", startup = "runtime.asm", linker = "link.ld" }

[[platform.isa]]
triple = "riscv32-unknown-none"
arch = "riscv"
expected_abi_hash = "0xf6dd34a3e430bd85"
metal = { path = "metal/riscv32", startup = "runtime.asm", linker = "link.ld" }

[metal]
path = "metal/armv7m"
startup = "runtime.asm"
linker = "link.ld"

[memory]
flash = { name = "FLASH", origin = 0x10000000, length = 0x00400000, exec = "xip" }
sram = { name = "SRAM", origin = 0x20000000, length = 0x00084000 }
ds_region = "SRAM"
ds_size = 0x4000

[capabilities.gpio]
glue = "glue/gpio"

[capabilities.uart]
glue = "glue/uart"

[capabilities.time]
glue = "glue/time"

[deploy]
method = "uf2"
boot = "image_def"

[[deploy.step]]
run = "picotool"
args = ["load", "{elf}", "-f", "-x"]

[debug]
diag_transport = "uart0"
rsp = "probe"
probe = "openocd"
probe_config = "rp2350.cfg"

[test]
rung = "hardware"
target = "crates/tyu/tests/platform_hil.rs"
evidence = "docs/hil/rp2350.md"

[secure_boot]
supported = false
encryption_implies_secure_boot = true

# ---- descriptor v2 ---------------------------------------------------------

[platform.allocator]
region = "SRAM"                # memory region allocatable payloads live in
offset = 0x8400                # byte offset into region (carve-out below DS/RS)
length = 0x77000               # allocatable span
impl = "glue/region"           # module dir providing platform.region.* words
policy = "pool-firstfit"       # documentation for reviewers; opaque to toolchain

[platform.scoped]
metadata_slots_max = 64        # diagnostic bound; per-word body count must be <=

[[platform.windows]]
id = 0
name = "apb"
kind = "bus"
bind = "arm-thumb-ldr-literal"
base = 0x40000000
size = 0x10000

[[platform.windows]]
id = 1
name = "mmio"                  # QEMU/HIL scratch
kind = "bus"
bind = "arm-thumb-ldr-literal"
base = 0x20000000
size = 0x1000

# Register maps: the descriptor is the authoritative home for maps a board
# exposes. Source-side `register-map` declarations must MATCH these rows
# (name/offset/width/access); the descriptor adds what source cannot say.
# Full datasheet-verified tables land in P8; this minimal table pins the shape.
[[platform.devices]]
map = "GPIO"
instance = "gpio0"
window = 0
base_offset = 0xD000
registers = [
  { offset = 0x000, name = "ctrl", width = 32, access = "rw", write_kind = "plain", read_kind = "plain", atomic_max = 32 },
  { offset = 0x004, name = "intr_stat", width = 32, access = "rw", write_kind = "w1c", read_kind = "plain", atomic_max = 32 },
  { offset = 0x020, name = "fifo", width = 8, access = "rw", write_kind = "plain", read_kind = "effectful", atomic_max = 8 },
]

[platform.metal.trust]         # empty by default; lists asm-backed words
words = []                     # e.g. ["platform.boot.enter_xip"]