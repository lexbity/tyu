[platform]
name = "x86_64-unknown-none"
schema = 2
family = "q35"
compiler-interface = 1
description = "x86_64 bare-metal runtime"

[[platform.isa]]
triple = "x86_64-unknown-none"
arch = "x86_64"
default = true
expected_abi_hash = "0x50fbac4f4e87016c"

[metal]
path = "metal"
startup = "runtime.asm"
linker = "link.ld"

[verification]
# ISR bounded-stack(N_isr) grant (static-verification.md §6.4, amended).
# N_main is NOT declared: it is derived from the runtime binary's own
# data-stack geometry (__lang_ds_limit - __lang_ds_base over slot_bytes) at
# report-composition time - bounds are computed, never hand-declared
# (stack-bound-analysis.md §13).
isr_stack_slots = 32   # N_isr; ISRs are masked (no nesting) so one grant covers all handlers

[features.concurrency]
unit = "concurrency.asm"

[features.module-loading]
unit = "modload.asm"

[capabilities.gpio]
glue = "glue/gpio"

[capabilities.uart]
glue = "glue/uart"

[capabilities.time]
glue = "glue/time"

[deploy]
method = "elf-qemu"
boot = "raw_vectors"

[debug]
diag_transport = "uart0"
rsp = "qemu-stub"
probe = ""
probe_config = ""

[test]
rung = "qemu"
target = "crates/tyu/tests/run_qemu_x86.rs"
evidence = "evidence/run_qemu_x86.md"

[test.debug_agent]
supported = true
target = "crates/tyu/tests/escalate.rs"
evidence = "evidence/debug_escalate.md"

# ---- descriptor v2 ---------------------------------------------------------

[[platform.apertures]]
id = 0
name = "mmio"                  # the in-guest-RAM `__mmio_mem` array (D-7)
kind = "emulated"              # RAM the runtime owns; base is a link-time symbol
size = 0x10000

# Devices for the execution-test fixtures (P4 migration, D-14).
[[platform.devices]]
map = "Scratch"
instance = "scratch"
aperture = 0
base_offset = 0x0
registers = [
  { offset = 0x00, name = "A", width = 32, access = "rw" },
  { offset = 0x04, name = "B", width = 32, access = "rw" },
]

[[platform.devices]]
map = "Scratch"
instance = "ptrscratch"
aperture = 0
base_offset = 0x100
registers = [
  { offset = 0x00, name = "FIRST", width = 64, access = "rw" },
  { offset = 0x08, name = "SECOND", width = 64, access = "rw" },
]

[[platform.devices]]
map = "Scratch"
instance = "widthscratch"
aperture = 0
base_offset = 0x0
registers = [
  { offset = 0x00, name = "B", width = 8, access = "rw" },
  { offset = 0x02, name = "H", width = 16, access = "rw" },
  { offset = 0x04, name = "W", width = 32, access = "rw" },
  { offset = 0x08, name = "D", width = 64, access = "rw" },
]

[[platform.devices]]
map = "Strategy"
instance = "strategy"
aperture = 0
base_offset = 0x0
registers = [
  { offset = 0x00, name = "CTRL", width = 32, access = "rw", write_kind = "plain", read_kind = "plain", atomic_max = 32 },
  { offset = 0x04, name = "STATUS", width = 32, access = "rw", write_kind = "w1c", read_kind = "plain", atomic_max = 32 },
  { offset = 0x08, name = "SETBITS", width = 32, access = "rw", write_kind = "w1s", read_kind = "plain", atomic_max = 32 },
  { offset = 0x10, name = "FIFO", width = 8, access = "rw", write_kind = "plain", read_kind = "effectful", atomic_max = 8 },
  { offset = 0x14, name = "FIFO32", width = 32, access = "rw", write_kind = "plain", read_kind = "effectful", atomic_max = 32 },
  { offset = 0x18, name = "SETEFF", width = 32, access = "rw", write_kind = "w1s", read_kind = "effectful", atomic_max = 32 },
  { offset = 0x20, name = "WIDEW", width = 64, access = "rw", write_kind = "plain", read_kind = "plain", atomic_max = 32 },
  { offset = 0x28, name = "SETXOR", width = 32, access = "rw", write_kind = "xor", read_kind = "plain", atomic_max = 32 },
]

[[platform.devices]]
map = "StrategySeed"
instance = "strategy_seed"
aperture = 0
base_offset = 0x0
registers = [
  { offset = 0x04, name = "STATUS", width = 32, access = "rw" },
]

[platform.metal.trust]
words = []
