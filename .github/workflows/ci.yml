# CI — per-commit test suite.
#
# Runs the full test matrix on every push/PR, including the poison
# corpus, debug-mode (`.lang.debug`) leg, hermetic RSP client, and
# all three hardware backends (x86_64, ARM, RISC-V) under QEMU.
#
# Invariant layer (ci/guards.sh): fails if any crate with #[test]
# reports zero runnable tests, or if test=false/harness=false hides
# a #[test] outside tests/.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CI: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Lint — static checks and test-count guard
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ci-lint.sh
        run: bash ci-lint.sh

  # ---------------------------------------------------------------------------
  # x86_64 — primary architecture (fully tooled)
  # ---------------------------------------------------------------------------
  x86_64:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install tools (x86_64)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            fasm \
            qemu-system-x86_64 \
            qemu-system-arm \
            qemu-system-riscv32 \
            gcc-arm-none-eabi \
            gcc-riscv64-unknown-elf \
            ld
      - name: Statement goldens (PLAN-VERIFY-3 P1.3, blocking gate)
        # The band rule (§Q4 item 3) on a fresh checkout: bootstrap the
        # gitignored goldens with two regen passes (byte-determinism), then
        # re-run as the strict comparison. Drift in the canonical encoder is a
        # hard failure here, and determinism is re-proven on every CI run.
        # Runs BEFORE ci/guards.sh so G25 sees the golden set present.
        run: |
          TYU_REGEN_STATEMENT_GOLDENS=1 cargo test --release -p tooling-tests --test statement_goldens
          TYU_REGEN_STATEMENT_GOLDENS=1 cargo test --release -p tooling-tests --test statement_goldens
          cargo test --release -p tooling-tests --test statement_goldens
          test "$(ls test-goldens/statements/x86_64-unknown-none/*.stmt.json | wc -l)" -eq 6
      - name: Test-delivery guard
        run: bash ci/guards.sh
      - name: Build (release)
        run: cargo build --release -p langc -p tyu -p lmod-pack -p lmod-encrypt -p lmod-sign
      - name: Platform QEMU matrix
        run: |
          ./target/release/tyu platform lint x86_64-unknown-none
          ./target/release/tyu platform lint armv7m-unknown-none
          ./target/release/tyu platform lint riscv32-unknown-none
          ./target/release/tyu platform lint rp2350
          ./target/release/tyu test --all-platforms --manifest=crates/execution-tests/fixtures/manifest.toml
      - name: Dead-code gate (effect/context consolidation, S13)
        # Authoritative backstop for the consolidation dead-API gate: any
        # orphaned item on the semantics surface fails the build. Catches new
        # dead code the named-symbol denylist in ci-lint.sh cannot see.
        run: RUSTFLAGS="-D dead_code" cargo build --release -p semantics
      - name: Workspace unit tests (all crates, default features)
        run: cargo test --workspace --release
      - name: Golden codegen corpus
        run: cargo test --release -p langc --test golden_codegen
      - name: Encryption feature tests
        run: cargo test --release -p loader-core --features encryption
      - name: diag-core std feature tests
        run: cargo test --release -p diag-core --features std
      - name: Poison corpus
        run: cargo test --release -p tyu --test poison
      - name: Escalation test
        run: cargo test --release -p tyu --test escalate
      - name: Hang classification
        run: cargo test --release -p tyu --test hang
      - name: Stack witness
        run: cargo test --release -p tyu --test stack_witness
      - name: Debug-mode leg (with .lang.debug)
        run: |
          cargo test --release -p execution-tests --test x86_64_none -- trap_emits_framed_d_record
      - name: RSP client integration (hermetic, no gdb needed)
        run: cargo test --release -p rsp-client -- qemu_read_register_and_memory

  # ---------------------------------------------------------------------------
  # ARM (armv7m) — cross-compiled under QEMU
  # ---------------------------------------------------------------------------
  arm:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install tools (ARM)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc-arm-none-eabi \
            qemu-system-arm
      - name: Test-delivery guard
        run: bash ci/guards.sh
      - name: Build langc
        run: cargo build --release -p langc -p tyu
      - name: ARM codegen unit tests
        run: cargo test --release -p codegen-arm
      - name: ARM runtime symbol export test
        run: cargo test --release -p execution-tests --test arm -- runtime_exports_required_symbols
      - name: ARM memory/MMIO codegen test
        run: cargo test --release -p execution-tests --test arm -- arm_memory_load_store_asm arm_mmio_field_round_trip_asm
      - name: ARM QEMU execution (trap, overflow)
        run: cargo test --release -p execution-tests --test arm -- trap_emits_framed_d_record trap_overflow_emits_trap_code_10

  # ---------------------------------------------------------------------------
  # RISC-V (riscv32) — cross-compiled under QEMU
  # ---------------------------------------------------------------------------
  riscv:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install tools (RISC-V)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc-riscv64-unknown-elf \
            qemu-system-riscv32
      - name: Test-delivery guard
        run: bash ci/guards.sh
      - name: Build langc
        run: cargo build --release -p langc -p tyu
      - name: RISC-V codegen unit tests
        run: cargo test --release -p codegen-riscv
      - name: RISC-V runtime symbol export test
        run: cargo test --release -p execution-tests --test riscv -- runtime_exports_required_symbols
      - name: RISC-V QEMU execution (trap, overflow)
        run: cargo test --release -p execution-tests --test riscv -- trap_emits_framed_d_record trap_overflow_emits_trap_code_10

  # ---------------------------------------------------------------------------
  # Feature matrix — verifies gate diagnostic + size delta for slim vs fat
  # ---------------------------------------------------------------------------
  feature_matrix:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            fasm \
            qemu-system-x86_64 \
            ld
      - name: Test-delivery guard
        run: bash ci/guards.sh
      - name: Build langc
        run: cargo build --release -p langc -p tyu
      - name: Feature gate tests (E6101/E6102 readiness)
        run: cargo test --release -p tooling-tests --test feature_gate
      - name: Slim vs fat size delta (x86_64)
        run: cargo test --release -p execution-tests --test x86_64_none -- slim_image_smaller_than_fat modpack_symbols_present_only_with_modload
      - name: Slim vs fat feature-derived symbol set (x86_64)
        run: cargo test --release -p execution-tests --test x86_64_none -- runtime_exports_required_symbols

  # ---------------------------------------------------------------------------
  # Debug build (cargo check, no tests) — exercises no_std compile paths
  # ---------------------------------------------------------------------------
  build_only:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Check all targets compile
        run: cargo check --workspace --release

  # ---------------------------------------------------------------------------
  # Fuzz smoke — parser/container hostile-byte harnesses
  # ---------------------------------------------------------------------------
  fuzz_smoke:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly + cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked
      - name: Container parser fuzz smoke
        run: cargo +nightly fuzz run parse_container -- -runs=100000
      - name: Modinfo decoder fuzz smoke
        run: cargo +nightly fuzz run modinfo_decode -- -runs=100000
      - name: Decode targets with tracked seeds (PLAN-VERIFY-3 P16.3, §11.8)
        run: bash ci/fuzz.sh --seconds 60

  # ---------------------------------------------------------------------------
  # Miri — UB / unsafe-container tests under the Miri interpreter
  # ---------------------------------------------------------------------------
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly + miri
        run: |
          rustup toolchain install nightly --component miri
          cargo +nightly miri setup
      - name: loader-core + lmod byte logic under Miri
        run: cargo +nightly miri test -p loader-core -p lmod
      - name: frontend/fixed — unsafe FixedVec tests under Miri
        run: cargo +nightly miri test -p frontend --test fixed
      - name: semantics/arena — unsafe manual-Drop tests under Miri
        run: cargo +nightly miri test -p semantics --test arena
