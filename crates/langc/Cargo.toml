[package]
name = "langc"
version = "0.1.0"
edition = "2021"
description = "Single-module Tyu compiler CLI."

[features]
# G54's red-path build deliberately corrupts one backend arm in the compiler
# process invoked by the differential test. This is test-only instrumentation;
# normal builds have no altered codegen behavior.
wasm-selftest = ["codegen-wasm/wasm-selftest"]

[lib]
name = "langc"
path = "src/lib.rs"

[[bin]]
name = "langc"
path = "src/main.rs"
test = false

[dependencies]
hosted = { path = "../hosted" }
hosted-rt = { path = "../hosted-rt" }
frontend = { path = "../frontend" }
semantics = { path = "../semantics" }
ir = { path = "../ir" }
codegen-core  = { path = "../codegen-core" }
codegen-x86_64 = { path = "../codegen-x86_64" }
codegen-wasm = { path = "../codegen-wasm" }
codegen-arm   = { path = "../codegen-arm" }
codegen-riscv = { path = "../codegen-riscv" }
lmod           = { path = "../lmod" }
verifier       = { path = "../verifier" }
