[package]
name = "loader-core"
version = "0.1.0"
edition = "2021"

# no_std — used by on-device loader and host-side testing.
[dependencies]
lmod = { path = "../lmod" }
chacha20poly1305 = { version = "0.10", default-features = false, optional = true }

[dev-dependencies]
hmac = "0.12"
sha2 = "0.10"

[features]
encryption = ["chacha20poly1305"]
