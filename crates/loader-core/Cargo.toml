[package]
name = "loader-core"
version = "0.1.0"
edition = "2021"
description = "Core loader implementation for Tyu `.lmod` modules."

# no_std — used by on-device loader and host-side testing.
# CI runs both: `cargo test --workspace` (no encryption feature) and
# `cargo test --features encryption -p loader-core` (or the workspace
# variant in ci.yml).  Both states are meaningful.
[dependencies]
lmod = { path = "../lmod" }
chacha20poly1305 = { version = "0.10", default-features = false, optional = true }
aead = { version = "0.5", default-features = false, features = ["alloc", "getrandom"], optional = true }
getrandom = { version = "0.2", default-features = false, optional = true }
# On Linux, getrandom uses the getrandom syscall by default with
# /dev/urandom fallback. No extra features needed.

[dev-dependencies]
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
lmod-sign = { path = "../lmod-sign" }
lmod-encrypt = { path = "../lmod-encrypt" }

[features]
device-loader = []
encryption = ["chacha20poly1305", "aead", "getrandom"]
