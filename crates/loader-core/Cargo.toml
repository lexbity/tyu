[package]
name = "loader-core"
version = "0.1.0"
edition = "2021"
description = "Core loader implementation for Tyu `.lmod` modules."

# no_std — used by on-device loader and host-side testing.
# CI runs both: `cargo test --workspace` (no encryption feature) and
# `cargo test --features encryption -p loader-core` (or the workspace
# variant in ci.yml).  Both states are meaningful.
[dependencies]
lmod = { path = "../lmod" }
hmac = { version = "0.12", default-features = false, optional = true }
sha2 = { version = "0.10", default-features = false, optional = true }
zeroize = { version = "1", default-features = false }

[dev-dependencies]
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false }
lmod-sign = { path = "../lmod-sign" }
lmod-encrypt = { path = "../lmod-encrypt" }
trybuild = "1"

[features]
device-loader = []
signing = ["hmac", "sha2"]
encryption = []
# P11.2: recompute the verify_manifest digest (E6501) — opt-in so the
# constrained device loader (16 KiB text budget, G7) skips the crypto while
# keeping the structural + policy checks (E6500/E6502) always on. The hosted
# runtime and the tooling build enable it.
verify-manifest = ["sha2"]
