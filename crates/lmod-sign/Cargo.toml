[package]
name = "lmod-sign"
version = "0.1.0"
edition = "2021"
description = "Signing tooling for `.lmod` modules."

[lib]
name = "lmod_sign"
path = "src/lib.rs"

[[bin]]
name = "lmod-sign"
path = "src/main.rs"

[dependencies]
lmod = { path = "../lmod" }
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
hex = "0.4"
