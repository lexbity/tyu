[package]
name = "tooling-tests"
version = "0.1.0"
edition = "2021"
description = "CLI, corpus, and integration tests for Tyu tooling."

[dependencies]
codegen-core = { path = "../codegen-core" }
diag-core = { path = "../diag-core", features = ["std"] }
harness-core = { path = "../harness-core" }
hex = "0.4"
hosted = { path = "../hosted" }
hosted-rt = { path = "../hosted-rt" }
loader-core = { path = "../loader-core" }
lmod = { path = "../lmod" }
tyu = { path = "../tyu" }
lmod-pack = { path = "../lmod-pack" }
sha2 = { version = "0.10", default-features = false }
serde_json = "1"

[dev-dependencies]
# PLAN-WASM-1 D-2/FR-15: `verifier::src_interp` must not compile into
# production builds, so the verifier `test-util` feature is enabled only from
# dev-dependencies (this crate is a test-only crate with no `src/` — all of
# its `verifier::` usage sits in `tests/`).
verifier = { path = "../verifier", features = ["test-util"] }

[features]
default = []
encryption = ["hosted/encryption"]
