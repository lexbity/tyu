# E3647: base_offset + map extent must fit within the aperture.
[platform]
name = "bad"
schema = 2
family = "bad"

[[platform.apertures]]
id = 0
name = "a"
kind = "bus"
base = 0x40000000
size = 0x100

[[platform.devices]]
map = "G"
instance = "g"
aperture = 0
base_offset = 0x100
registers = [
  { offset = 0x0, name = "r", width = 32, access = "rw" },
]