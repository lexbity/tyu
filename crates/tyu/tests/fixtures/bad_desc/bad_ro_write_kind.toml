# E3647: access = ro forbids write_kind != plain (w1s/w1c need a write path).
[platform]
name = "bad"
schema = 2
family = "bad"

[[platform.apertures]]
id = 0
name = "a"
kind = "bus"
base = 0x40000000
size = 0x1000

[[platform.devices]]
map = "G"
instance = "g"
aperture = 0
base_offset = 0x0
registers = [
  { offset = 0x0, name = "r", width = 32, access = "ro", write_kind = "w1c" },
]