[package]
name = "tyu"
version = "0.1.0"
edition = "2021"
description = "Project-level build, run, test, deploy, and toolchain CLI."

[[bin]]
name = "tyu"
path = "src/main.rs"

[dependencies]
codegen-core = { path = "../codegen-core" }
diag-core = { path = "../diag-core", features = ["std"] }
frontend = { path = "../frontend" }
harness-core = { path = "../harness-core" }
rsp-client = { path = "../rsp-client" }
hex = "0.4"
libc = "0.2"
lmod = { path = "../lmod" }
thiserror = "2"
lmod-pack = { path = "../lmod-pack" }
lmod-encrypt = { path = "../lmod-encrypt" }
lmod-sign = { path = "../lmod-sign" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
zeroize = "1"

[dev-dependencies]
hex = "0.4"
hosted = { path = "../hosted" }
libc = "0.2"
loader-core = { path = "../loader-core" }
