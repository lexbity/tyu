[package]
name = "hosted"
version = "0.1.0"
edition = "2021"
description = "Host-side runtime glue for Tyu binaries."

[lib]
doctest = false

[dependencies]
loader-core = { path = "../loader-core", features = ["verify-manifest"] }
lmod = { path = "../lmod" }

[features]
default = []
encryption = ["loader-core/encryption"]
