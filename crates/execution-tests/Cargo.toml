[package]
name    = "execution-tests"
version = "0.1.0"
edition = "2021"
description = "QEMU-backed end-to-end execution tests for Tyu."

[dependencies]
codegen-core = { path = "../codegen-core" }
harness-core = { path = "../harness-core" }
diag-core = { path = "../diag-core", features = ["std"] }
tyu = { path = "../tyu" }

[[test]]
name    = "x86_64_none"
harness = true

[[test]]
name    = "arm"
harness = true

[[test]]
name    = "riscv"
harness = true
