[package]
name    = "execution-tests"
version = "0.1.0"
edition = "2021"
description = "QEMU-backed end-to-end execution tests for Tyu."

[dependencies]
codegen-core = { path = "../codegen-core" }
harness-core = { path = "../harness-core" }
diag-core = { path = "../diag-core", features = ["std"] }
hosted = { path = "../hosted" }
loader-core = { path = "../loader-core" }
lmod = { path = "../lmod" }
lmod-pack = { path = "../lmod-pack" }
tyu = { path = "../tyu" }

[dev-dependencies]
codegen-arm = { path = "../codegen-arm" }
codegen-riscv = { path = "../codegen-riscv" }
codegen-x86_64 = { path = "../codegen-x86_64" }
frontend = { path = "../frontend" }
ir = { path = "../ir" }
serde_json = "1"

[[test]]
name    = "x86_64_none"
harness = true

[[test]]
name    = "hosted"
harness = true

[[test]]
name    = "arm"
harness = true

[[test]]
name    = "riscv"
harness = true
