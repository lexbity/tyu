[package]
name = "lmod-encrypt"
version = "0.1.0"
edition = "2021"
description = "Encryption tooling for `.lmod` modules."

[lib]
name = "lmod_encrypt"
path = "src/lib.rs"

[[bin]]
name = "lmod-encrypt"
path = "src/main.rs"

[dependencies]
lmod = { path = "../lmod" }
# default-features = false keeps `crypto-common`'s `std` feature off, so this
# crate does not leak `std` into the no_std crates it shares chacha20poly1305
# with (loader-core, and transitively hosted/hosted-rt) under workspace feature
# unification. `alloc` covers the Vec-returning AEAD API; `getrandom` provides OsRng.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom"] }
getrandom = "0.2"
hex = "0.4"
# `getrandom` (not `std`) provides OsRng; `std` would unify into the shared
# rand_core used by loader-core's AEAD path and leak std into the no_std crates.
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
