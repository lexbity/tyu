[package]
name = "wasm-repl"
version = "0.1.0"
edition = "2021"
description = "Tyu console interpreter fork (PLAN-WASM-1): the concrete fuel-metered interpreter over the production IR; no_std, zero-dependency, forbid(unsafe_code)."

[features]
# G52 red-path instrument (PLAN-WASM-1 §Q10 / AC-9): with this feature the
# canonical `add_i64` mnemonic decodes to `Sub` instead of `Add`, so the
# fragvec differential (tests/frag_parity.rs) MUST fail. Enabled only by
# `ci/wasm.sh --selftest` to demonstrate the gate's red path; never enabled
# in a production build. The default (featureless) build is byte-identical in
# behavior to the frozen upstream `verifier::src_interp` (§Q1).
wasm-selftest = []

[dependencies]
# The fork's ONLY dependency (R-A; I-6): the `ir` crate, which furnishes the
# `OpKind`/`CmpKind`/`Atom`/`BlockId`/`TypeId`/`ReadKind`/`WriteKind`/
# `BarrierKind` surface the fragment engine transcribes against.
ir = { path = "../ir" }

[dev-dependencies]
# The frozen upstream surface the fork is pinned against (G52). `test-util`
# is the verifier's existing dev-only feature: as a *dev*-dependency here it
# is never part of a production build (FR-1).
verifier = { path = "../verifier", features = ["test-util"] }
serde_json = "1"