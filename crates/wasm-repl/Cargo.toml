[package]
name = "wasm-repl"
version = "0.1.0"
edition = "2021"
description = "Tyu console interpreter fork (PLAN-WASM-1): the concrete fuel-metered interpreter over the production IR; no_std, zero-dependency, forbid(unsafe_code)."

[features]
# G52 red-path instrument (PLAN-WASM-1 §Q10 / AC-9): with this feature the
# canonical `add_i64` mnemonic decodes to `Sub` instead of `Add`, so the
# fragvec differential (tests/frag_parity.rs) MUST fail. Enabled only by
# `ci/wasm.sh --selftest` to demonstrate the gate's red path; never enabled
# in a production build. The default (featureless) build is byte-identical in
# behavior to the frozen upstream `verifier::src_interp` (§Q1).
wasm-selftest = []
# The host CLI test instrument (src/bin/repl-cli.rs); the lib stays `no_std`.
# Enabled only where the driver is built (G56, manual smoke).
cli = []

[[bin]]
name = "repl-cli"
path = "src/bin/repl-cli.rs"
required-features = ["cli"]

[dependencies]
# The engine's runtime dependencies (R-A; I-6): `ir`, plus the host-agnostic
# compiler-front layers it compiles with (parse → typecheck → IR structs).
# All are `no_std` + zero-external-dep; nothing below talks to a filesystem
# (the `SourceTable` seam, §Q12).
ir = { path = "../ir" }
frontend = { path = "../frontend" }
semantics = { path = "../semantics" }
verifier = { path = "../verifier" }
# The compiled platform descriptor type (P4): `compile` takes
# `Option<&CompiledDescriptor>` and resolves the aperture table from it —
# the descriptor *is* the target-spec's compiled board identity (§Q5/DEC-8),
# and P4 deliberately wires platform packs through it (the plan's R-A
# "codegen-core (target spec only)" grows exactly by this type).
codegen-core = { path = "../codegen-core" }

[dev-dependencies]
# The frozen upstream surface the fork is pinned against (G52). `test-util`
# is the verifier's existing dev-only feature: as a *dev*-dependency here it
# is never part of a production build (FR-1).
verifier = { path = "../verifier", features = ["test-util"] }
serde_json = "1"
# Property tests (P2): transaction/aliasing invariants over the engine
# (proptest is the repo's shared dev-dep for exactly this).
proptest = "1"
# The G53 harness legs: the native runner (`tyu`), the target identity
# (`codegen-core`), and the parser/IR types the fixtures exercise.
tyu = { path = "../tyu" }
codegen-core = { path = "../codegen-core" }
frontend = { path = "../frontend" }
ir = { path = "../ir" }