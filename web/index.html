<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!--
    Tyu browser REPL (PLAN-WASM-1 P5): a fully static page (NFR-10).
    default-src 'self' — every asset is same-origin; `wasm-unsafe-eval` is
    the dedicated directive that allows WebAssembly compilation (it is NOT
    script eval; no `eval`, no `new Function`, no inline handlers exist on
    this page).
  -->
  <!--
    style-src 'unsafe-inline' (PLAN-WASM-2 W2 as-built amendment): the
    CodeMirror 6 stack mounts <style> elements for its themes (StyleModule).
    A static page has no per-response nonce to offer, and style-src
    'unsafe-inline' admits stylesheets only — never script execution
    (script-src stays 'self' 'wasm-unsafe-eval'; no eval, no inline handlers).
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'" />
  <title>Tyu REPL</title>
  <link rel="stylesheet" href="style.css" />
  <!--
    The editor stack (PLAN-WASM-2 W2, DEC-17): served ONLY as the build-
    generated vendor bundle + stylesheet (R-F), with the script's integrity
    pinned by SRI (the JS-integrity mechanism that works; hash-pinning-
    executed-JS-from-JS is circular). The integrity attribute is written by
    `ci/wasm.sh build-web` from the vendor manifest — never hand-edited. If
    this check fails, the page degrades to the textarea with a banner
    (DEC-26); it never blanks.
  -->
  <link rel="stylesheet" href="pkg/vendor/editor.css" />
  <script src="pkg/vendor/editor.js" integrity="sha384-fMuxnRocPJt3wXM9QEO8amhtFcJ9GUTXsy6XAWFqvMtCuxTqIg9onMNXUxHmrF8r" crossorigin="anonymous"></script>
</head>
<body>
  <header id="statusbar">
    <span id="brand">tyu repl</span>
    <span id="status" data-state="booting">booting…</span>
    <label id="backend-mode-label">execution
      <select id="backend-mode" aria-label="execution backend">
        <option value="interp" selected>interpreter</option>
        <option value="wasm">wasm32</option>
      </select>
    </label>
    <span id="engine-info" title="engine version + artifact SHA-256 (§10)"></span>
  </header>

  <main id="layout">
    <section id="editor-pane">
      <textarea id="editor" spellcheck="false"
        placeholder="Tyu is a stack language.&#10;Try: 1 2 +&#10;Define: : double ( i64 -- i64 ) dup + ;&#10;Print:  65 testio.write-byte  (after importing platform/testio)"></textarea>
      <div id="editor-actions">
        <button id="run" disabled title="reset the session and run the whole buffer (Mod-Enter)">run</button>
        <button id="submit" disabled title="submit into the live session (Shift-Mod-Enter)">submit</button>
        <button id="step" disabled title="resume a fuel-suspended phrase">step</button>
        <span id="fuel-note" class="muted"></span>
      </div>
      <div id="diag" class="hidden"></div>
      <div id="backend-notice" class="backend-notice" hidden></div>
    </section>

    <section id="side">
      <h2>examples <span class="muted">(the book's labs)</span></h2>
      <nav id="examples" aria-label="examples"></nav>

      <h2>stack <span class="muted">(bottom-first)</span></h2>
      <ol id="stack" aria-live="polite"></ol>

      <h2>output</h2>
      <pre id="console" aria-live="polite"></pre>

      <details id="ir-pane">
        <summary>IR <span class="muted">(the last-good --emit=ir render)</span></summary>
        <pre id="ir"></pre>
      </details>

      <h2>call stack <span class="muted">(live frames / post-mortem backtrace)</span></h2>
      <div id="frames" aria-live="polite"></div>

      <h2>transcript <span class="muted">(this session's submissions)</span></h2>
      <div id="transcript" aria-live="polite"></div>

      <div id="debug-pane" class="hidden"></div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
