[workspace]
resolver = "2"
members = [
  "crates/hosted",
  "crates/hosted-rt",
  "crates/frontend",
  "crates/ir",
  "crates/codegen-core",
  "crates/codegen-x86_64",
  "crates/codegen-arm",
  "crates/codegen-riscv",
  "crates/lang-assemble",
  "crates/langc",
  "crates/semantics",
  "crates/tooling-tests",
  "crates/execution-tests",
  "crates/lmod",
  "crates/lmod-pack",
  "crates/loader-core",
  "crates/harness-core",
  "crates/diag-core",
  "crates/rsp-client",
  "crates/tyu",
  "crates/lmod-encrypt",
  "crates/lmod-sign",
]

# Panic=abort is intentional: the hosted-rt crate provides a custom panic handler
# and the compiler pipeline uses manual Drop (assume_init_drop) in several places.
# A panic that unwinds could double-free or leave memory in an inconsistent state.
#
# Ideally host tool binaries (tyu, lmod-*, langc) would use panic=unwind to allow
# clean ?-based error teardown, but Cargo does not support per-package panic
# profile overrides (panic is a codegen-level setting that must be consistent
# across a crate's dependency graph).  The test profile inherits from dev
# (panic=abort) but Cargo ignores this setting for test targets; tests run with
# panic=unwind regardless, so error-propagation tests work in the test suite.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
