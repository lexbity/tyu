[workspace]
resolver = "2"
members = [
  "crates/hosted",
  "crates/hosted-rt",
  "crates/frontend",
  "crates/ir",
  "crates/lang-assemble",
  "crates/langc",
  "crates/semantics",
  "crates/tooling-tests",
]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[profile.test]
panic = "abort"
