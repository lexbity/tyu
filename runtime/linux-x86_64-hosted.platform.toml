[platform]
name = "linux-x86_64-hosted"
schema = 2
family = "q35-hosted"
compiler-interface = 1
description = "x86_64 hosted runtime"

[[platform.isa]]
triple = "x86_64-unknown-linux-gnu"
arch = "x86_64"
default = true
expected_abi_hash = "0x50fbac4f4e87016c"

[metal]
path = "."
startup = "linux-x86_64-hosted.asm"
linker = ""

[capabilities.gpio]
glue = "platform/gpio"

[deploy]
method = "qemu"
boot = "raw_vectors"

[debug]
diag_transport = "stdio"
rsp = ""
probe = ""
probe_config = ""

[test]
rung = "untested"

# ---- descriptor v2 ---------------------------------------------------------

[[platform.apertures]]
id = 0
name = "mmio"                  # the in-guest-RAM `__mmio_mem` array (D-7)
kind = "emulated"              # RAM the runtime owns; base is a link-time symbol
size = 0x10000

# Devices for the tooling-test register maps (P4 migration).
[[platform.devices]]
map = "GPIO"
instance = "gpio"
aperture = 0
base_offset = 0x0
registers = [
  { offset = 0x00, name = "DATA", width = 32, access = "rw" },
]

[[platform.devices]]
map = "GPIO"
instance = "gpio_io"
aperture = 0
base_offset = 0x1000
registers = [
  { offset = 0x00, name = "OUT_SET", width = 32, access = "wo" },
  { offset = 0x20, name = "IN", width = 32, access = "ro" },
]

[[platform.devices]]
map = "UART"
instance = "uart"
aperture = 0
base_offset = 0x2000
registers = [
  { offset = 0x00, name = "CTRL", width = 32, access = "rw" },
]

[[platform.devices]]
map = "GPIO"
instance = "gpio_outin"
aperture = 0
base_offset = 0x1000
registers = [
  { offset = 0x00, name = "OUT", width = 32, access = "wo" },
  { offset = 0x04, name = "IN", width = 32, access = "ro" },
]

[[platform.devices]]
map = "GPIO"
instance = "gpio_pincfg"
aperture = 0
base_offset = 0x1000
registers = [
  { offset = 0x200, name = "PINCFG", width = 32, access = "rw" },
]

[[platform.devices]]
map = "GPIO"
instance = "gpio_data10"
aperture = 0
base_offset = 0x100
registers = [
  { offset = 0x10, name = "DATA", width = 32, access = "rw" },
]

[[platform.devices]]
map = "Strategy"
instance = "strategy"
aperture = 0
base_offset = 0x0
registers = [
  { offset = 0x00, name = "CTRL", width = 32, access = "rw", write_kind = "plain", read_kind = "plain", atomic_max = 32 },
  { offset = 0x04, name = "STATUS", width = 32, access = "rw", write_kind = "w1c", read_kind = "plain", atomic_max = 32 },
  { offset = 0x08, name = "SETBITS", width = 32, access = "rw", write_kind = "w1s", read_kind = "plain", atomic_max = 32 },
  { offset = 0x10, name = "FIFO", width = 8, access = "rw", write_kind = "plain", read_kind = "effectful", atomic_max = 8 },
  { offset = 0x14, name = "FIFO32", width = 32, access = "rw", write_kind = "plain", read_kind = "effectful", atomic_max = 32 },
  { offset = 0x18, name = "SETEFF", width = 32, access = "rw", write_kind = "w1s", read_kind = "effectful", atomic_max = 32 },
  { offset = 0x20, name = "WIDEW", width = 64, access = "rw", write_kind = "plain", read_kind = "plain", atomic_max = 32 },
  { offset = 0x28, name = "SETXOR", width = 32, access = "rw", write_kind = "xor", read_kind = "plain", atomic_max = 32 },
]

[[platform.devices]]
map = "StrategySeed"
instance = "strategy_seed"
aperture = 0
base_offset = 0x0
registers = [
  { offset = 0x04, name = "STATUS", width = 32, access = "rw" },
]

[platform.metal.trust]
words = []
