# Tyu Lean 4 verification port (PLAN-VERIFY-3 Phase P3).
#
# Layout (developer-proof-pipeline.md §Q5 / §P0):
#   - `Tyu.lean`            — library root (generated data layer + interfaces)
#   - `Tyu/IR/*.lean`       — GENERATED by crates/verifier/src/export/lean.rs
#                             (drift-locked; DO NOT EDIT)
#   - `Tyu/Mem.lean`        — GENERATED interfaces + law-statement placeholders
#   - `Main.lean`           — the `conformance` executable (P3.2): consumes the
#                             per-target `tyu.vec/1` corpora and reproduces the
#                             abstract transfer observations byte-exactly.
name = "tyu-lean-port"
version = "0.1.0"

[[lean_lib]]
name = "Tyu"
srcDir = "."

[[lean_exe]]
name = "conformance"
srcDir = "."
root = "Main"

[[lean_exe]]
name = "gen"
srcDir = "."
root = "GenMain"

[[lean_exe]]
name = "automation_rate"
srcDir = "."
root = "AutomationMain"

[[lean_exe]]
name = "fill"
srcDir = "."
root = "FillMain"
